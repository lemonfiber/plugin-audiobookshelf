[package]
name = "audiobookshelf-adapter"
version = "0.18.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/plugin-audiobookshelf"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "Speaks lemonfiber's owner.claim and media.serve contracts in front of Audiobookshelf"
publish = false

[[bin]]
name = "audiobookshelf-adapter"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "733a12fc8ca8bfaa654cb7fa0fe1538bde1f502c" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "733a12fc8ca8bfaa654cb7fa0fe1538bde1f502c" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "733a12fc8ca8bfaa654cb7fa0fe1538bde1f502c" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
lemonfiber-fixtures = { git = "https://github.com/lemonfiber/lemonfiber", rev = "733a12fc8ca8bfaa654cb7fa0fe1538bde1f502c" }
lemonfiber-plugin = { git = "https://github.com/lemonfiber/lemonfiber", rev = "733a12fc8ca8bfaa654cb7fa0fe1538bde1f502c" }
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
