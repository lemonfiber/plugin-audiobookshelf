# The supply-chain posture check (Q-R56, Q-R59), called from spec.
name: scorecard
on:
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: "26 6 * * 1"
permissions:
  contents: read
jobs:
  scorecard:
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
    uses: lemonfiber/spec/.github/workflows/scorecard.yml@3807b6d59a2f247ec82dffe997e8bc1a54e1e183 # v1.0.140
