# Publish the adapter's image from every commit on main and from each train tag, and propose
# the digest it published to plugin.toml, through spec's reusable `adapter-release`
# (OPS-R90, OPS-R91).
name: release
on:
  push:
    tags: ["v*"]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: lemonfiber/spec/.github/workflows/adapter-release.yml@3807b6d59a2f247ec82dffe997e8bc1a54e1e183 # v1.0.140
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
